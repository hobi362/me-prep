<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>ME Interview &amp; FE Prep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ME Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a single drafting-sheet column (max 720px) with a sticky title strip and a fixed bottom tab bar.
   Tokens follow hobi362.github.io (paper / ink / accent / rust, IBM Plex), extended with a dark sheet. */
:root{
  --paper:#EDEFF2; --raised:#F7F8FA; --ink:#14202B; --ink-soft:#4A5560; --ink-faint:#7C8790;
  --line:#C7CDD4; --line-strong:#9AA4AD; --accent:#2C6E8E; --accent-soft:#DCE7EC;
  --rust:#B5502D; --rust-soft:#F2E1D8; --led:#3F7353; --led-soft:#DDEBE1;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10171D; --raised:#172028; --ink:#E4E9ED; --ink-soft:#AAB5BE; --ink-faint:#76828C;
  --line:#28343F; --line-strong:#3F4D59; --accent:#72B3D2; --accent-soft:#1B3240;
  --rust:#E38A63; --rust-soft:#3A2419; --led:#86C29B; --led-soft:#1C3325; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10171D; --raised:#172028; --ink:#E4E9ED; --ink-soft:#AAB5BE; --ink-faint:#76828C;
  --line:#28343F; --line-strong:#3F4D59; --accent:#72B3D2; --accent-soft:#1B3240;
  --rust:#E38A63; --rust-soft:#3A2419; --led:#86C29B; --led-soft:#1C3325; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;background-position:-1px -1px}
body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.86;pointer-events:none;z-index:-1}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--raised);border-bottom:2px solid var(--ink)}
.top-in{max-width:720px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:12px;height:48px}
.brand{font:700 15px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand small{font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink-faint);margin-left:8px;text-transform:none}
.brand{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:480px){.brand small{display:none}}
.back{border:1px solid var(--line-strong);background:transparent;border-radius:2px;height:32px;padding:0 10px;font:500 13px var(--mono);cursor:pointer}
.sync{margin-left:auto;flex:none;font:500 11px/1 var(--mono);color:var(--ink-faint);text-decoration:none;border:1px solid var(--line-strong);padding:5px 7px;white-space:nowrap}
.sync::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-faint);margin-right:6px;vertical-align:1px}
.sync[data-state="synced"]{color:var(--led);border-color:var(--led)} .sync[data-state="synced"]::before{background:var(--led)}
.sync[data-state="error"]{color:var(--rust);border-color:var(--rust)} .sync[data-state="error"]::before{background:var(--rust)}
.crumb{font:500 12px/1.2 var(--mono);color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}

main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px calc(var(--tab-h) + 40px)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--raised);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10.5px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);cursor:pointer;border-right:1px solid var(--line)}
.tab:last-child{border-right:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab .badge{font:600 10px var(--mono);background:var(--rust);color:var(--raised);border-radius:8px;padding:0 5px;margin-left:2px}

/* title block (drawing sheet) */
.tb{border:2px solid var(--ink);background:var(--raised);margin-bottom:20px}
.tb-main{padding:16px 16px 12px;border-bottom:1px solid var(--line-strong)}
.doctype{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:4px 6px;margin-bottom:10px}
h1{font:700 clamp(26px,6.5vw,34px)/1.1 var(--cond);margin:0;text-wrap:balance;letter-spacing:-.005em}
.sub{margin:8px 0 0;color:var(--ink-soft);font-size:15px;text-wrap:pretty}
.tb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.cell{padding:8px 12px;border-right:1px solid var(--line);border-top:1px solid var(--line);margin-top:-1px;min-width:0}
.cell .k{display:block;font:500 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.cell .v{display:block;font:600 17px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.cell .v small{font-size:12px;color:var(--ink-faint);font-weight:500}

h2{font:700 20px/1.2 var(--cond);letter-spacing:.01em;margin:28px 0 10px;text-wrap:balance}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line-strong)}

/* segmented control */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);background:var(--raised)}
.seg button{border:0;border-right:1px solid var(--line-strong);background:transparent;padding:10px 4px;font:600 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--raised)}

/* continue card */
.next{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1.5px solid var(--accent);background:var(--accent-soft);padding:14px 16px;text-decoration:none;color:inherit;margin-top:14px}
.next .k{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.next .t{font:700 19px/1.2 var(--cond);margin-top:4px}
.next .m{font:500 12.5px var(--mono);color:var(--ink-soft);margin-top:4px}
.next .go{font:700 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--raised);padding:10px 14px}

/* module rows */
.group{margin-top:8px}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.mrow:hover .mt{color:var(--accent)}
.mnum{font:600 13px var(--mono);color:var(--ink-faint);border:1px solid var(--line-strong);text-align:center;padding:6px 0;background:var(--raised)}
.mnum.done{background:var(--led-soft);border-color:var(--led);color:var(--led)}
.mt{font:600 16px/1.25 var(--sans)}
.mb{font-size:13.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border:1px solid var(--line-strong);color:var(--ink-soft)}
.tag.fe{border-color:var(--accent);color:var(--accent)}
.tag.int{border-color:var(--rust);color:var(--rust)}
.prog{font:500 12px var(--mono);color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px;background:var(--line);margin-top:6px;width:64px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--led)}

/* lesson list inside a module */
.lrow{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.check{width:22px;height:22px;border:1.5px solid var(--line-strong);display:grid;place-items:center;margin-top:1px;background:var(--raised)}
.check.on{background:var(--led);border-color:var(--led)}
.check.on::after{content:"";width:6px;height:11px;border:solid var(--raised);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.lt{font:600 16px/1.3 var(--sans)}
.lm{font:500 12px var(--mono);color:var(--ink-faint);margin-top:3px}

/* lesson body */
.lesson{max-width:65ch}
.lesson p{margin:0 0 14px;text-wrap:pretty}
.lesson h3{font:700 18px/1.25 var(--cond);margin:26px 0 8px;letter-spacing:.01em;text-wrap:balance}
.lesson ul,.lesson ol{margin:0 0 14px;padding-left:22px}
.lesson li{margin-bottom:6px}
.lesson li::marker{color:var(--ink-faint)}
.lesson b,.lesson strong{font-weight:600}
.lesson code,.fx{font-family:var(--mono);font-size:.92em}
.formulas{border:1px solid var(--line-strong);background:var(--raised);margin:0 0 16px}
.fr{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 14px;border-bottom:1px dashed var(--line)}
.fr:last-child{border-bottom:0}
.fr .e{font:500 15px/1.5 var(--mono);color:var(--ink);overflow-x:auto;white-space:nowrap}
.fr .n{font-size:13px;color:var(--ink-soft);line-height:1.4}
sub,sup{font-size:.72em;line-height:0}
.figure{margin:4px 0 18px;border:1px solid var(--line-strong);background:var(--raised);padding:12px 12px 8px;overflow-x:auto}
.figure svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.figure figcaption{font:500 12px/1.45 var(--mono);color:var(--ink-faint);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.figure figcaption b{color:var(--ink-soft)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;margin:0 0 16px;font-size:15px}
.note .k{display:block;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.note.you{border-color:var(--rust);background:var(--rust-soft)}
.note.you .k{color:var(--rust)}
.note.int{border-color:var(--ink);background:var(--raised)}
.note.int .k{color:var(--ink)}
.note.warn{border-color:var(--rust);background:transparent;border-style:solid;border-width:0 0 0 3px}
.note.warn .k{color:var(--rust)}
.note p:last-child{margin-bottom:0}
.tblwrap{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line-strong);background:var(--raised)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);background:var(--paper);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* questions */
.qs{margin-top:8px;display:grid;gap:12px}
.q{border:1.5px solid var(--ink);background:var(--raised)}
.q-h{display:flex;gap:10px;padding:12px 14px 0;align-items:baseline}
.q-n{font:600 12px var(--mono);color:var(--ink-faint);flex:none}
.q-t{font-weight:500;min-width:0}
.q-kind{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-left:auto;flex:none;color:var(--ink-faint)}
.q-kind.c{color:var(--accent)} .q-kind.i{color:var(--rust)}
.q-a{padding:12px 14px;border-top:1px dashed var(--line-strong);margin-top:12px;background:var(--paper);font-size:15px}
.q-a p{margin:0 0 8px}.q-a p:last-child{margin:0}
.q-a ul{margin:0 0 8px;padding-left:20px}
.q-actions{display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--raised);padding:9px 14px;font:700 13px var(--cond);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border-radius:0;min-height:40px}
.btn.primary{background:var(--ink);color:var(--raised)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--raised)}
.btn.good[aria-pressed="true"]{background:var(--led);border-color:var(--led);color:var(--raised)}
.btn.again[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:var(--raised)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

.lesson-end{margin-top:28px;display:grid;gap:10px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{border:1px solid var(--line-strong);padding:10px 12px;text-decoration:none;color:inherit;background:var(--raised);min-width:0}
.pager a .k{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:block}
.pager a .t{font:600 14px/1.3 var(--sans);display:block;overflow:hidden;text-overflow:ellipsis}
.pager a.nx{text-align:right}

/* flashcards */
.card{border:2px solid var(--ink);background:var(--raised);min-height:240px;display:flex;flex-direction:column}
.card-top{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-strong);font:500 12px var(--mono);color:var(--ink-faint)}
.card-top span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-top span:last-child{flex:none}
.card-q{padding:18px 16px;font:500 18px/1.45 var(--sans);flex:1}
.card-a{padding:14px 16px;border-top:1px dashed var(--line-strong);background:var(--paper)}
.card-a p{margin:0 0 8px}.card-a p:last-child{margin:0}
.card .q-actions{border-top:1px solid var(--line)}
.picker{display:grid;gap:10px;margin-top:12px}
select,input[type=search]{width:100%;font:500 15px var(--sans);padding:11px 12px;border:1.5px solid var(--ink);background:var(--raised);color:var(--ink);border-radius:0}
.empty{border:1px dashed var(--line-strong);padding:18px;color:var(--ink-soft);background:var(--raised);font-size:15px}

/* search + formula sheet */
.hit{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.hit .t{font-weight:600}
.hit .s{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.hit mark{background:var(--accent-soft);color:var(--ink)}
details.fs{border:1px solid var(--line-strong);background:var(--raised);margin-bottom:10px}
details.fs summary{padding:12px 14px;font:700 16px var(--cond);cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fs summary::after{content:"+";font:600 16px var(--mono);color:var(--ink-faint)}
details.fs[open] summary::after{content:"−"}
details.fs summary::-webkit-details-marker{display:none}
details.fs .formulas{margin:0;border-width:1px 0 0}
.fs-l{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:10px 14px 0;border-top:1px solid var(--line)}
.fs-l a{color:inherit}
.small{font-size:13px;color:var(--ink-faint)}
.plan{counter-reset:p;display:grid;gap:0;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan li::before{counter-increment:p;content:counter(p,decimal-leading-zero);font:600 13px var(--mono);color:var(--ink-faint);padding-top:2px}
.plan a{font-weight:600;text-decoration:none}
.plan span{display:block;font-size:13.5px;color:var(--ink-soft)}

/* engineering diagrams (inline SVG from diagrams.js) */
.dg *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dg .a{stroke:var(--accent)} .dg .r{stroke:var(--rust)} .dg .g{stroke:var(--line-strong);stroke-width:1} .dg .l{stroke:var(--line);stroke-width:1}
.dg .v{stroke:var(--led)}
.dg .w2{stroke-width:2.6} .dg .th{stroke-width:1}
.dg .dsh{stroke-dasharray:5 4}
.dg .fa{fill:var(--accent-soft)} .dg .fr{fill:var(--rust-soft)} .dg .fp{fill:var(--raised)} .dg .fq{fill:var(--paper)}
.dg .fk{fill:var(--ink)} .dg .fA{fill:var(--accent)} .dg .fR{fill:var(--rust)} .dg .fg{fill:var(--line)} .dg .fG{fill:var(--line-strong)} .dg .fv{fill:var(--led-soft)}
.dg .ns{stroke:none}
.dg .ah{stroke-width:1;fill:var(--ink)} .dg .ah.a{fill:var(--accent)} .dg .ah.r{fill:var(--rust)} .dg .ah.g{fill:var(--line-strong)} .dg .ah.v{fill:var(--led)}
.dg text{stroke:none;fill:var(--ink-soft);font:500 11px var(--mono)}
.dg text[class]{stroke:none}
.dg text.a{fill:var(--accent)} .dg text.r{fill:var(--rust)} .dg text.k{fill:var(--ink)} .dg text.f{fill:var(--ink-faint)} .dg text.v{fill:var(--led)}
.dg text.b{font-weight:600} .dg text.s{font-size:9.5px} .dg text.lg{font:700 13px var(--cond)}
</style>

<header class="top"><div class="top-in" id="topbar"></div></header>
<main id="view" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-go="home"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17"/><path d="M3.5 15.5h17M12 15.5v5"/></svg>Home</button>
  <button class="tab" data-go="topics"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Topics</button>
  <button class="tab" data-go="review"><svg viewBox="0 0 24 24"><rect x="6" y="3.5" width="13" height="16"/><path d="M4 7v13.5h12"/></svg><span>Review<span class="badge" id="rv-badge" hidden></span></span></button>
  <button class="tab" data-go="formulas"><svg viewBox="0 0 24 24"><path d="M15 4h-4.5L7 20l-3-6h3M13 10l6 8M19 10l-6 8"/></svg>Formulas</button>
  <button class="tab" data-go="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>Search</button>
</div></nav>

<script>
/* diagrams.js */
/* Content registry + diagram library.
   Every diagram returns an SVG string with class "dg"; colours come from CSS tokens so both themes work.
   Stroke classes: a accent, r rust, g grid, v green, dsh dashed, w2 heavy. Fill classes: fa fr fp fq fk fA fR fg fG fv. */
window.MODULES = [];
window.M = m => window.MODULES.push(m);

window.D = (() => {
  const n = v => Math.round(v * 10) / 10;
  const svg = (w, h, body, label = '') => `<svg class="dg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${body}</svg>`;
  const ln = (x1, y1, x2, y2, c = '') => `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" class="${c}"/>`;
  const pts = p => p.map(q => n(q[0]) + ',' + n(q[1])).join(' ');
  const pl = (p, c = '') => `<polyline points="${pts(p)}" class="${c}"/>`;
  const pg = (p, c = '') => `<polygon points="${pts(p)}" class="${c}"/>`;
  const pa = (d, c = '') => `<path d="${d}" class="${c}"/>`;
  const ci = (x, y, r, c = '') => `<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" class="${c}"/>`;
  const el = (x, y, rx, ry, c = '', rot = 0) => `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(rx)}" ry="${n(ry)}" class="${c}" transform="rotate(${rot} ${n(x)} ${n(y)})"/>`;
  const re = (x, y, w, h, c = '') => `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" class="${c}"/>`;
  const esc = s => String(s).replace(/&(?!#?\w+;)/g, '&amp;').replace(/</g, '&lt;');

    const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    const bx = x2 - ux * h, by = y2 - uy * h, px = -uy * h * 0.42, py = ux * h * 0.42;

  const path = (xy) => 'M' + xy.map(p => n(p[0]) + ' ' + n(p[1])).join('L');

    (xl ? tx(x1 - 2, oy - 7, xl, 'f s', 'end') : '') + (yl ? tx(ox + 6, y1 + 4, yl, '') : '');
  const ground = (x, y, w) => { let s = ln(x, y, x + w, y); for (let i = x + 4; i <= x + w; i += 7) s += ln(i, y, i - 6, y + 7, 'g'); return s; };

    for (let it = 0; it < 300; it++) z = z.map((zi, i) => { let d = cx(1, 0); z.forEach((zj, j) => { if (i !== j) d = cm(d, cx(zi.re - zj.re, zi.im - zj.im)); }); const q = cd(ev(zi), d); return cx(zi.re - q.re, zi.im - q.im); });

  lib.rrt = () => { const r = rng(11), W = 320, H = 190, obs = [[90, 20, 30, 110], [180, 80, 30, 110], [250, 20, 20, 90]]; const inObs = (x, y) => obs.some(o => x > o[0] - 3 && x < o[0] + o[2] + 3 && y > o[1] - 3 && y < o[1] + o[3] + 3);
    const free = (a, b) => { for (let t = 0; t <= 1; t += 0.05) if (inObs(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t)) return false; return true; };
    const start = [30, 170], goal = [300, 40], nodes = [{ p: start, par: -1 }]; let found = -1, step = 18;
    for (let i = 0; i < 1500 && found < 0; i++) { const q = r() < 0.08 ? goal : [10 + r() * W, 10 + r() * H]; let bi = 0, bd = 1e9; nodes.forEach((nd, j) => { const d = Math.hypot(nd.p[0] - q[0], nd.p[1] - q[1]); if (d < bd) { bd = d; bi = j; } });
      const f = nodes[bi].p, d = Math.min(step, bd); if (bd < 1) continue; const nw = [f[0] + (q[0] - f[0]) / bd * d, f[1] + (q[1] - f[1]) / bd * d]; if (nw[0] < 6 || nw[0] > 334 || nw[1] < 6 || nw[1] > 204 || !free(f, nw)) continue;
      nodes.push({ p: nw, par: bi }); if (Math.hypot(nw[0] - goal[0], nw[1] - goal[1]) < step && free(nw, goal)) { nodes.push({ p: goal, par: nodes.length - 1 }); found = nodes.length - 1; } }
    let s = obs.map(o => re(o[0], o[1], o[2], o[3], 'fG ns')).join('') + nodes.slice(1).map(nd => ln(nd.p[0], nd.p[1], nodes[nd.par].p[0], nodes[nd.par].p[1], 'g')).join('');
    const pth = []; for (let k = found; k >= 0; k = nodes[k].par) pth.push(nodes[k].p); s += pl(pth, 'r w2');

    return svg(340, 200, ln(40, Y(3), 330, Y(3), 'r dsh') + ln(40, Y(-3), 330, Y(-3), 'r dsh') + ln(40, Y(0), 330, Y(0), 'k') + tx(334, Y(3) + 4, 'UCL', 'r s', 'end') + tx(334, Y(-3) + 4, 'LCL', 'r s', 'end') + tx(334, Y(0) - 4, 'CL', 'k s', 'end') +
      pl(vals.map((v, i) => [X(i), Y(v)]), 'a') + vals.map((v, i) => ci(X(i), Y(v), 3, (i === 9 ? 'fR' : i > 15 && i < 23 ? 'fk' : 'fA') + ' ns')).join('') +
      tx(X(9) + 6, Y(3.4) - 2, 'beyond 3σ', 'r s') + tx(X(19), Y(-2.2), 'run of 7 above CL', 'k s', 'middle') + tx(20, 194, 'X̄ chart: UCL = X̿ + A₂R̄ ; react to special causes only', 'f s'), 'Statistical process control chart'); };

  lib.bathtub = () => { const X = t => 40 + t * 2.8, Y = h => 170 - h * 1.3;
    return svg(340, 205, axes(40, 170, 330, 14, 'time', 'failure rate λ(t)') + pa(plot(t => 80 * Math.exp(-t / 7) + 18 + (t > 70 ? 0.09 * (t - 70) ** 2 : 0), 0, 100, X, Y), 'a w2') +
      ln(X(22), 30, X(22), 170, 'g dsh') + ln(X(72), 30, X(72), 170, 'g dsh') + tx(X(11), 190, 'infant', 'f s', 'middle') + tx(X(11), 202, 'β < 1', 'r s', 'middle') + tx(X(47), 190, 'useful life (random)', 'f s', 'middle') + tx(X(47), 202, 'β = 1, λ const', 'r s', 'middle') + tx(X(86), 190, 'wear-out', 'f s', 'middle') + tx(X(86), 202, 'β > 1', 'r s', 'middle') +
      tx(X(24), 40, 'burn-in / ESS', 'k s') + tx(X(74), 40, 'PM / replace', 'k s'), 'Bathtub curve'); };

  lib.fishbone = (head = 'Brake slip') => { const cats = [['Man', 70], ['Machine', 160], ['Material', 250], ['Method', 70], ['Measurement', 160], ['Environment', 250]]; let s = ar(20, 100, 290, 100, 'k', 8) + box(290, 82, 46, 36, '', 'fr') + tx(313, 97, head.split(' ')[0], 'k s b', 'middle') + tx(313, 110, head.split(' ')[1] || '', 'k s b', 'middle');
    cats.forEach(([t, x], i) => { const top = i < 3; s += ln(x, top ? 30 : 170, x + 40, 100, 'a') + tx(x - 4, top ? 24 : 186, t, 'a s b', 'middle'); });
    return svg(340, 200, s, 'Ishikawa fishbone diagram'); };

  lib.relBlocks = () => svg(340, 170, tx(10, 26, 'series', 'k b') + ln(10, 50, 40, 50) + box(40, 36, 50, 28, 'R₁', 'fa') + ln(90, 50, 110, 50) + box(110, 36, 50, 28, 'R₂', 'fa') + ln(160, 50, 180, 50) + box(180, 36, 50, 28, 'R₃', 'fa') + ln(230, 50, 250, 50) + tx(256, 54, 'Rs = ΠRi', 'a s b') +
    tx(10, 96, 'parallel', 'k b') + pl([[10, 130], [40, 130], [40, 110], [60, 110]]) + pl([[40, 130], [40, 150], [60, 150]]) + box(60, 98, 50, 24, 'R₁', 'fr') + box(60, 138, 50, 24, 'R₂', 'fr') + pl([[110, 110], [130, 110], [130, 150], [110, 150]]) + ln(130, 130, 150, 130) +
    tx(160, 134, 'Rp = 1 − Π(1 − Ri)', 'r s b') + tx(160, 150, 'e.g. 0.9 ∥ 0.9 = 0.99', 'f s'), 'Series and parallel reliability block diagrams');

  lib.apqp = () => { const ph = ['Plan &\ndefine', 'Product\ndesign', 'Process\ndesign', 'Product &\nprocess val.', 'Launch &\nfeedback']; let s = '';
    ph.forEach((t, i) => { const x = 8 + i * 65; s += pg([[x, 30], [x + 58, 30], [x + 68, 55], [x + 58, 80], [x, 80], [x + 10, 55]], i === 3 ? 'fr' : 'fa'); t.split('\n').forEach((l, j) => s += tx(x + 34, 52 + j * 12, l, 'k s b', 'middle')); });
    return svg(340, 150, s + tx(8, 20, 'APQP phases (AIAG)', 'f s') + ar(250, 110, 250, 84, 'r', 6) + tx(250, 124, 'PPAP submitted', 'r s b', 'middle') + tx(250, 138, '(PSW sign-off)', 'r s', 'middle') + tx(8, 110, 'outputs: DFMEA, PFMEA,', 'k s') + tx(8, 124, 'control plan, MSA, SPC,', 'k s') + tx(8, 138, 'process flow, run @ rate', 'k s'), 'APQP phases'); };

  lib.vModel = () => { const L = y => 30 + (y - 30) * 80 / 140, Rr = y => 310 - (y - 30) * 80 / 140;
    return svg(340, 215, pl([[30, 30], [110, 170], [230, 170], [310, 30]], 'a w2') +
      [['User needs', 'Validation', 30], ['System reqs', 'System verification', 76], ['Subsystem', 'Integration test', 122]].map(([l, r, y]) => tx(L(y) + 8, y + 4, l, 'k s') + tx(Rr(y) - 8, y + 4, r, 'k s', 'end')).join('') +
      ln(L(30) + 70, 30, Rr(30) - 70, 30, 'r dsh') + ln(L(76) + 78, 76, Rr(76) - 116, 76, 'r dsh') +
      tx(110, 188, 'detailed design', 'k s', 'middle') + tx(230, 188, 'unit test', 'k s', 'middle') + tx(170, 162, 'build', 'f s', 'middle') +
      tx(170, 208, 'traceability: every requirement ↔ a test', 'f s', 'middle'), 'Systems engineering V-model'); };

  lib.cashFlow = () => svg(340, 170, ln(20, 90, 320, 90) + [0, 1, 2, 3, 4, 5].map(i => ln(30 + i * 56, 86, 30 + i * 56, 94) + tx(30 + i * 56, 108, i, 'f s', 'middle')).join('') +
    ar(30, 90, 30, 160, 'r') + tx(36, 158, 'P = −$10k', 'r s') + [1, 2, 3, 4, 5].map(i => ar(30 + i * 56, 90, 30 + i * 56, 55, 'a')).join('') + tx(170, 44, 'A = $3k/yr', 'a s', 'middle') + ar(310, 55, 310, 20, 'a') + tx(304, 20, 'F (salvage)', 'a s', 'end') +
    tx(80, 140, 'NPV = −P + A(P/A,i,n) + F(P/F,i,n)', 'k s'), 'Cash flow diagram');

  lib.snapFit = () => svg(340, 170, re(20, 90, 60, 60, 'fq') + pa('M80 90 L220 90 L220 72 L250 90 L250 102 L80 102 Z', 'fa') + pa('M80 90 L220 70 L220 52 L250 70 L250 82 L80 102', 'a dsh') + dar(270, 70, 270, 90, 'r') + tx(276, 84, 'y', 'r b') +
    dar(80, 120, 220, 120, 'k') + tx(150, 134, 'L', 'k b', 'middle') + tx(20, 30, 'max strain ε = 1.5·t·y / L²', 'k b') + tx(20, 46, 'keep ε < allowable (PC ~4%, POM ~6%, glass-filled ~1-2%)', 'f s') + tx(20, 164, 'taper beam, fillet root, return angle sets retention', 'f s'), 'Cantilever snap fit');

  lib.fatigueFracture = () => svg(340, 180, ci(110, 90, 72, 'fq') + [22, 38, 54, 70, 86].map(r => pa(`M${n(40 + r * Math.cos(-60 * deg) - 0)} ${n(90 + r * Math.sin(-60 * deg))} A${r} ${r} 0 0 1 ${n(40 + r * Math.cos(60 * deg))} ${n(90 + r * Math.sin(60 * deg))}`, 'a')).join('') +
    pa('M152 30 A72 72 0 0 1 152 150 Q120 90 152 30 Z', 'fr r') + ci(40, 90, 4, 'fR ns') + tx(34, 176, '', 's') +
    tx(200, 60, 'origin (stress raiser)', 'r s') + tx(200, 86, 'beach marks: smooth,', 'a s') + tx(200, 100, 'progressive crack', 'a s') + tx(200, 126, 'rough final overload', 'k s') + tx(200, 140, 'zone (small → low stress)', 'k s') +
    ln(44, 90, 196, 60, 'g dsh'), 'Fatigue fracture surface');

  lib.hbridge = () => svg(340, 190, ln(60, 20, 280, 20, 'k') + ln(60, 170, 280, 170, 'k') + tx(170, 14, '+V', 'a b', 'middle') + tx(170, 186, 'GND', 'f s', 'middle') +
    [[60, 'Q1', 'Q3'], [280, 'Q2', 'Q4']].map(([x, a, b]) => ln(x, 20, x, 170) + box(x - 18, 40, 36, 30, a, 'fa') + box(x - 18, 120, 36, 30, b, 'fp')).join('') +
    ln(60, 95, 140, 95) + ln(200, 95, 280, 95) + ci(170, 95, 28, 'fr') + tx(170, 99, 'M', 'k lg', 'middle') +
    tx(100, 88, 'Q1+Q4 → fwd', 'r s', 'middle') + tx(240, 88, 'Q2+Q3 → rev', 'r s', 'middle') + tx(170, 140, 'never Q1+Q3 (shoot-through)', 'f s', 'middle'), 'H-bridge motor driver');

  lib.weibull = () => { const X = t => 40 + t * 70, Y = v => 170 - v * 70; const pdf = b => t => b * Math.pow(t, b - 1) * Math.exp(-Math.pow(t, b));
    return svg(340, 200, axes(40, 170, 330, 14, 't/η', 'f(t)') + pa(plot(pdf(0.7), 0.05, 4, X, Y), 'k') + pa(plot(pdf(1), 0, 4, X, Y), 'a w2') + pa(plot(pdf(3.5), 0, 4, X, Y), 'r w2') +
      tx(X(0.25), Y(1.6), 'β=0.7', 'k s') + tx(X(1.7), Y(0.35), 'β=1 (exponential)', 'a s') + tx(X(1.2), Y(1.35), 'β=3.5 (wear-out)', 'r s') + tx(40, 194, 'R(t) = exp[−(t/η)^β] ;  η = life at 63.2% failed', 'f s'), 'Weibull distributions'); };

  lib.dmaic = () => { const s = ['Define', 'Measure', 'Analyze', 'Improve', 'Control']; return svg(340, 90, s.map((t, i) => box(6 + i * 67, 20, 60, 34, t, i % 2 ? 'fp' : 'fa') + (i < 4 ? ar(66 + i * 67, 37, 73 + i * 67, 37, '', 5) : '')).join('') + tx(6, 78, 'charter/VOC → MSA, baseline → root cause → DOE → SPC', 'f s'), 'DMAIC'); };

  /* ---------- ROBOTIC ACTUATORS ---------- */
  lib.jointStack = () => { const c = 118, mr = (x, w, r1, r2, cl) => re(x, c - r2, w, r2 - r1, cl) + re(x, c + r1, w, r2 - r1, cl);
    let s = ln(8, c, 332, c, 'g dsh');
    s += mr(16, 250, 70, 76, 'fq') + mr(16, 300, 8, 12, 'fg') + mr(22, 12, 14, 42, 'fv') + mr(42, 34, 16, 60, 'fr') +
      mr(84, 72, 46, 68, 'fa') + mr(90, 60, 32, 43, 'fG') + mr(116, 8, 12, 32, 'fp') +
      mr(168, 12, 12, 38, 'fp') + mr(172, 18, 45, 60, 'fr') + mr(182, 6, 60, 70, 'fq') + mr(180, 52, 40, 44, 'fp') + mr(228, 6, 12, 44, 'fp') +
      mr(234, 34, 12, 54, 'fv') + mr(240, 24, 62, 70, 'fq') + ci(252, c - 58.5, 4, 'fp') + ci(252, c + 58.5, 4, 'fp') + mr(272, 8, 14, 40, 'fv');
    s += tx(59, 20, 'brake', 'k s b', 'middle') + ln(59, 24, 59, c - 60, 'k th') +
      tx(120, 20, 'frameless motor', 'k s b', 'middle') + ln(120, 24, 120, c - 68, 'k th') +
      tx(258, 20, 'cross-roller bearing', 'k s b', 'middle') + ln(252, 24, 252, c - 63, 'k th') +
      tx(12, 216, 'motor encoder', 'k s b') + ln(28, 206, 28, c + 42, 'k th') +
      tx(200, 216, 'strain wave gear', 'k s b', 'middle') + ln(200, 206, 200, c + 60, 'k th') +
      tx(296, 216, 'output', 'k s b', 'middle') + ln(276, 206, 276, c + 40, 'k th') +
      tx(170, 234, 'housing · hollow shaft for cables · output encoder at right', 'f s', 'middle');
    return svg(340, 242, s, 'Cross-section of a robot joint actuator module'); };

  lib.hdStiffness = () => { const X = th => 170 + th * 58, Y = T => 106 - T * 80, h = 0.2;
    const f = T => { const a = Math.abs(T), sg = Math.sign(T), T1 = 0.25, T2 = 0.6, K1 = 0.35, K2 = 0.55, K3 = 0.8; return sg * (a <= T1 ? a / K1 : a <= T2 ? T1 / K1 + (a - T1) / K2 : T1 / K1 + (T2 - T1) / K2 + (a - T2) / K3); };
    const up = [], dn = []; for (let i = 0; i <= 80; i++) { const T = -1 + i / 40; up.push([X(f(T) - h * (1 - T * T)), Y(T)]); dn.push([X(f(T) + h * (1 - T * T)), Y(T)]); }
    return svg(340, 212, ar(20, 106, 332, 106, '', 6) + ar(170, 196, 170, 12, '', 6) + tx(330, 99, 'twist θ', 'f s', 'end') + tx(176, 20, 'torque T', 'f s') +
      pl(up, 'a w2') + pl(dn, 'r w2') + tx(206, 116, 'K1 (soft)', 'k s b') + tx(246, 84, 'K2', 'k s b') + tx(278, 48, 'K3', 'k s b') +
      dar(X(-h), 124, X(h), 124, 'r') + tx(X(-h) - 4, 128, 'lost motion', 'r s', 'end') +
      tx(24, 30, 'loading', 'a s') + tx(24, 44, 'unloading', 'r s') + tx(170, 208, 'stiffness rises with torque; hysteresis loop', 'f s', 'middle'), 'Strain wave gear torsional stiffness and hysteresis'); };

  lib.ratioAccel = () => { const X = lg => 44 + (lg - 1) / 2 * 276, Y = v => 180 - v * 150, a = N => 2 * 100 * N / (N * N + 1e4);
    return svg(340, 215, axes(44, 180, 330, 14, 'gear ratio N (log)', 'relative') + pa(plot(lg => a(10 ** lg), 1, 3, X, Y), 'a w2') + pa(plot(lg => 10 / 10 ** lg, 1, 3, X, Y), 'r dsh') +
      ln(X(2), Y(1), X(2), 180, 'g dsh') + ci(X(2), Y(1), 3.5, 'fk ns') + tx(X(2) + 6, Y(1) - 6, 'N* = √(JL/Jm)', 'k s b') +
      tx(X(2.45), Y(0.62) - 8, 'load acceleration', 'a s') + tx(X(1.12) + 4, 60, 'max output speed', 'r s') +
      [[1, '10'], [2, '100'], [3, '1000']].map(([lg, t]) => ln(X(lg), 180, X(lg), 184) + tx(X(lg), 196, t, 'f s', 'middle')).join('') +
      tx(44, 211, 'torque-limited motor, JL/Jm = 10⁴ at the output', 'f s'), 'Gear ratio versus load acceleration'); };

  lib.sea = () => svg(340, 156, box(16, 50, 62, 40, 'motor', 'fa') + ln(78, 70, 96, 70, 'w2') + box(96, 50, 70, 40, 'gear N', 'fp') + ln(166, 70, 182, 70, 'w2') +
    spring(182, 70, 246, 70, 5, 9) + tx(214, 44, 'spring k', 'k s b', 'middle') + re(246, 46, 78, 48, 'fr') + tx(285, 74, 'load', 'k b', 'middle') +
    tx(47, 108, 'θm (motor enc.)', 'a s', 'middle') + tx(285, 108, 'θl (output enc.)', 'a s', 'middle') +
    tx(16, 132, 'τ = k (θm/N − θl): the spring is the torque sensor', 'k s') + tx(16, 148, 'softer k: finer force control, safer impacts, lower bandwidth', 'f s'), 'Series elastic actuator');

  lib.actThermal = () => { const res = (x1, x2, y, t) => ln(x1, y, x2, y) + re((x1 + x2) / 2 - 18, y - 7, 36, 14, 'fp') + tx((x1 + x2) / 2, y - 12, t, 'k s', 'middle');
    const cap = (x, t) => ln(x, 64, x, 96) + ln(x - 12, 96, x + 12, 96, 'w2') + ln(x - 12, 104, x + 12, 104, 'w2') + ln(x, 104, x, 118) + ground(x - 12, 118, 24) + tx(x + 16, 103, t, 'k s');
    return svg(340, 180, ar(8, 64, 64, 64, 'r') + tx(8, 56, 'P = I²R', 'r s b') + res(70, 190, 64, 'R wind→hsg') + res(190, 300, 64, 'R hsg→amb') + cap(70, 'Cw') + cap(190, 'Ch') +
      [70, 190, 300].map(x => ci(x, 64, 4, 'fk ns')).join('') + tx(70, 28, 'Tw winding', 'k s b', 'middle') + tx(190, 28, 'Th housing', 'k s b', 'middle') + tx(300, 28, 'Ta ambient', 'k s b', 'middle') +
      tx(12, 152, 'steady state: Tw = Ta + P·(Rwh + Rha)', 'k s') + tx(12, 168, 'winding τ ~ minutes, housing τ ~ tens of minutes', 'f s'), 'Two-node thermal model of a motor'); };

  return Object.assign(lib, { svg, ln, pl, pg, pa, ci, el, re, tx, ar, dar, plot, axes, ground, pin, tri, roller, spring, box, sum });
})();

<script>
/* content/01-interview.js */
M({
  id: 'interview', title: 'Interview playbook', group: 'career', tracks: ['int'],
  blurb: 'Your two-minute story, a bank of STAR stories from your own record, and a method for whiteboard and design problems.',
  lessons: [
    {
      title: 'Tell your story in two minutes', min: 12,
      sub: 'Present, proof, past, future.',
      b: [
        ['p', 'Nearly every interview opens with “walk me through your background.” The answer sets the frame for the whole hour, so script it, rehearse it out loud, and keep it to about two minutes. Use <b>present → proof → past → future</b>, not a chronological CV read-out.'],
        ['h', 'The structure'],
        ['ol', [
          '<b>Present (30 s):</b> who you are now in one sentence, plus what makes you different. For example: a mechanical design engineer in robotics who also writes and debugs the control software for the mechanisms they design.',
          '<b>Proof (45 s):</b> two concrete results with numbers or stakes: a field problem you solved, a design you took from concept to production, an invention, a test programme you led.',
          '<b>Past (30 s):</b> how you got here, one sentence per stage (degrees, research, previous roles).',
          '<b>Future (15 s):</b> why this role, tied to what they need. “I’m looking for a role where owning the mechanism <i>and</i> understanding the control loop around it is the job, not a side skill.”',
        ]],
        ['int', '<p>Tailor the proof to the posting. A design-heavy role wants to hear about actuators, brakes, tolerance stacks and supplier testing. A controls or robotics role wants controller architecture, plant models and system identification.</p>'],
        ['h', 'Signals interviewers listen for at senior level'],
        ['ul', [
          '<b>Ownership:</b> “I own the requirements and the design” beats “I helped with.”',
          '<b>Judgement under uncertainty:</b> how you chose tests, sample sizes and what you didn’t test.',
          '<b>Cross-functional reach:</b> suppliers, software, quality, manufacturing, end users.',
          '<b>Multiplying others:</b> tools, training and documentation you built, and people you mentored.',
          '<b>Honesty about limits:</b> say what you would do differently.',
        ]],
        ['warn', '<p>Naming internal project codenames or confidential details. Publicly released product names are fine; describe everything else generically (“a next-generation platform”).</p>'],
        ['h', 'Also prepare these openers'],
        ['tbl', ['Question', 'What they are testing', 'Anchor'], [
          ['Why are you leaving?', 'Motivation, flight risk', 'Growth toward full system or subsystem ownership; never criticise the employer'],
          ['Why us?', 'Research, fit', 'One product detail + one technical problem you would enjoy'],
          ['Biggest strength?', 'Self-awareness', 'Your differentiator, with one concrete example'],
          ['Weakness?', 'Coachability', 'A real one, plus the system you built to manage it'],
          ['Where in 5 years?', 'Trajectory', 'Technical lead or principal: owning architecture across disciplines'],
        ]],
      ],
      q: [
        ['Say your two-minute answer out loud and time it. Which of the four parts ran long?', '<p>Most people overrun the “past” section. Cut the chronology down to one sentence per stage and spend the saved time on the proof points. Record yourself once; it shows filler words right away.</p>', 'i'],
        ['Write your one-sentence differentiator.', '<p>A good one names what you do and why the combination matters, e.g. “I design robotic actuators and mechanisms and I also build and debug the control software that runs them, so I work well on problems at the boundary between the two.”</p>', 'i'],
        ['An interviewer for a pure mechanical design role asks why you spent time in controls software. How do you frame it?', '<p>As the thing that makes you a better mechanical designer: you design mechanisms knowing what stiffness, backlash, friction and sensor placement do to the control loop. Give one concrete example.</p>', 'i'],
        ['Why should you not read your CV chronologically in the opener?', '<p>It buries the result under dates, spends the interviewer’s attention on early roles, and doesn’t answer the real question: why you, for this job. Present → proof → past → future puts the relevant evidence first.</p>'],
        ['Name three senior-level signals and a line from your own work that shows each.', '<p>Pick ownership, judgement and multiplying others. For each, write one sentence that starts with “I” and names something specific: a requirement you owned, a test decision you made, a tool or training you built.</p>', 'i'],
      ],
    },
    {
      title: 'Your STAR story bank', min: 15,
      sub: 'Six stories cover most behavioural questions. Know each one cold.',
      b: [
        ['p', 'Behavioural questions (“tell me about a time…”) are scored on <b>S</b>ituation, <b>T</b>ask, <b>A</b>ction, <b>R</b>esult. Spend roughly 15% on S+T, 60% on A (what <i>you</i> did, using “I”), 25% on R and what you learned. Aim for 2 to 3 minutes each.'],
        ['h', 'Build six stories'],
        ['ol', [
          '<b>A hard technical problem you solved</b>, ideally a field issue or root-cause investigation.',
          '<b>Something you created</b>: an invention, a new architecture, a design that shipped.',
          '<b>Delivering under pressure</b>: a deadline you met and how you cut scope or risk.',
          '<b>De-risking without hardware</b>: modelling, simulation or analysis that changed a decision.',
          '<b>Making the team better</b>: a tool, training, process or mentoring.',
          '<b>A failure or mistake</b>, and what you changed afterwards.',
        ]],
        ['p', 'For each, write the S, T, A and R as bullets with numbers where you can (cost, time, defect rate, test results), and note which prompts it answers.'],
        ['fig', () => D.fishbone('Root cause'), 'For a root-cause story, a fishbone shows how you structured the search across people, machine, material, method, measurement and environment.'],
        ['tbl', ['Common prompt', 'Best story type'], [
          ['A failure / mistake', 'A real test or design miss; show what you changed in your process'],
          ['Conflict with a colleague', 'A disagreement over ownership or a technical approach, settled with data'],
          ['Influencing without authority', 'Getting an idea adopted outside your chain of command'],
          ['Tight deadline', 'Delivering under pressure'],
          ['Ambiguous problem', 'A root-cause investigation'],
          ['Working with suppliers', 'A supplier test programme or quality issue'],
          ['Mentoring / leadership', 'Training, tools, interns'],
        ]],
        ['warn', '<p>Saying “we” through the whole Action section. Interviewers can’t credit you for team work unless you name your part.</p>'],
      ],
      q: [
        ['Tell me about a time you found the root cause of a difficult field problem.', '<p>Show the structure: containment → data → hypotheses across mechanical and software causes (fishbone) → analysis (tolerance stacks, friction, loads) → confirming tests → root cause → corrective and preventive action → verification of effectiveness. Close with what you would do earlier next time.</p>', 'i'],
        ['What is the percentage split of a good STAR answer?', '<p>About 15% situation and task, 60% action, 25% result and learning.</p>'],

M({

    {

          '<b>Self-locating and self-fixturing:</b> chamfers, lead-ins, pilots, alignment pins.',

        ['f', [['E<sub>DFA</sub> = 3 · N<sub>min</sub> / t<sub>total</sub>', 'Boothroyd–Dewhurst design efficiency: 3 s ideal time per theoretical-minimum part'], ['N<sub>min</sub> = parts that pass the three questions', '']]],

<script>
/* app.js */
(() => {
  const GROUPS = [
    ['career', 'Interview playbook'],
    ['act', 'Robotic actuator design'],
    ['found', 'Math, statistics & professional practice'],
    ['mech', 'Engineering mechanics'],
    ['therm', 'Thermal & fluid sciences'],
    ['mat', 'Materials'],
    ['mfg', 'Manufacturing, DFM/DFA & tolerancing'],
    ['md', 'Machine design & failure'],
    ['mech2', 'Mechanisms, actuators & precision'],
    ['rob', 'Robotics'],
    ['ctl', 'Controls'],
    ['ee', 'Electrical, instrumentation & ML'],
    ['qual', 'Quality, reliability & product development'],
  ];
  const MODS = window.MODULES;
  MODS.forEach((m, i) => { m.num = String(i + 1).padStart(2, '0'); m.lessons.forEach((l, j) => { l.mod = m; l.idx = j; l.key = m.id + '-' + (j + 1); }); });
  const LESSONS = MODS.flatMap(m => m.lessons);
  const BYKEY = Object.fromEntries(LESSONS.map(l => [l.key, l]));
  const BYMOD = Object.fromEntries(MODS.map(m => [m.id, m]));

  /* ---------- progress storage ----------
     S.t stamps every change (lesson done/undone, card mark, last lesson, focus) so two copies of the
     progress can be merged key by key: the newer change wins. Copies live in this browser
     (localStorage), in the viewer's private cloud record when opened from claude.ai (db capability),
     and in progress files the viewer saves and loads by hand. */
  const SKEY = 'meprep.v1';
  const blank = () => ({ done: {}, q: {}, last: null, track: 'all', t: {} });
  const norm = o => { const b = blank(); if (o && typeof o === 'object') { ['done', 'q', 't'].forEach(k => { if (o[k] && typeof o[k] === 'object') b[k] = Object.assign({}, o[k]); }); if (typeof o.last === 'string') b.last = o.last; if (typeof o.track === 'string') b.track = o.track; } return b; };
  let S = blank();
  try { const raw = localStorage.getItem(SKEY); if (raw) S = norm(JSON.parse(raw)); } catch (e) {}
  const stamp = k => { S.t[k] = Date.now(); };
  const merge = (A, B) => {
    A = norm(A); B = norm(B); const out = blank();
    const pickKey = (tk, a, b) => { const ta = A.t[tk] || 0, tb = B.t[tk] || 0; if (ta || tb) { out.t[tk] = Math.max(ta, tb); return tb > ta ? b : a; } return a !== undefined ? a : b; };
    new Set([...Object.keys(A.done), ...Object.keys(B.done), ...Object.keys(A.t).concat(Object.keys(B.t)).filter(k => k.startsWith('d:')).map(k => k.slice(2))])
      .forEach(k => { const v = pickKey('d:' + k, A.done[k], B.done[k]); if (v) out.done[k] = v; });
    new Set([...Object.keys(A.q), ...Object.keys(B.q), ...Object.keys(A.t).concat(Object.keys(B.t)).filter(k => k.startsWith('q:')).map(k => k.slice(2))])
      .forEach(k => { const v = pickKey('q:' + k, A.q[k], B.q[k]); if (v) out.q[k] = v; });
    out.last = pickKey('last', A.last, B.last) || null;
    out.track = pickKey('track', A.track, B.track) || 'all';
    return out;
  };
  const canon = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v);
  const saveLocal = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };

  /* cloud sync: only when the page runs on claude.ai with a signed-in viewer */
  const sync = { state: 'local', ref: null, timer: 0, writing: false, again: false };
  const SYNC_LABEL = { local: 'This device only', connecting: 'Connecting…', saving: 'Saving…', synced: 'Synced', error: 'Sync paused', offline: 'Offline · will sync', reauth: 'Reconnect Dropbox' };
  const setSync = st => { sync.state = st; const el = document.getElementById('sync-pill'); if (el) { el.textContent = SYNC_LABEL[st]; el.dataset.state = st; } const n = document.getElementById('sync-note'); if (n) n.innerHTML = syncNote(); };
  const push = async () => {
    if (!sync.ref) return;
    if (sync.writing) { sync.again = true; return; }
    sync.writing = true; setSync('saving');
    try { await sync.ref.set(JSON.parse(canon(S))); setSync('synced'); }
    catch (e) {
      if (e && e.code === 'unavailable') { sync.again = true; await new Promise(r => setTimeout(r, 1500 + Math.random() * 1500)); }
      else { sync.ref = null; setSync('error'); }
    }
    sync.writing = false;
    if (sync.again && sync.ref) { sync.again = false; push(); }
  };
  const schedulePush = () => { if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(push, 1200); };
  const save = () => { saveLocal(); schedulePush(); dbxSchedule(); };

  /* Dropbox sync (the hosted copy, e.g. GitHub Pages). OAuth 2 with PKCE straight from the browser:
     no server, the app key is public by design, and access is limited to this app's own folder
     (Dropbox/Apps/<app name>/progress.json). Each sync reads the file, merges, and writes back only if
     something changed, so two devices never overwrite each other's newer progress. */
  const CFG = window.MEPREP_CONFIG || {};
  const DBX_KEY = (CFG.dropboxAppKey || '').trim();
  const IN_ARTIFACT = !!(window.claude && typeof window.claude.use === 'function');
  const DBX_ON = !!DBX_KEY && !IN_ARTIFACT && /^https:|^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(location.href);
  const DKEY = 'meprep.dropbox', DPATH = '/progress.json';
  const dbx = { tok: null, busy: false, again: false, timer: 0, msg: '' };
  try { dbx.tok = JSON.parse(localStorage.getItem(DKEY) || 'null'); } catch (e) {}
  const dbxSaveTok = () => { try { dbx.tok ? localStorage.setItem(DKEY, JSON.stringify(dbx.tok)) : localStorage.removeItem(DKEY); } catch (e) {} };
  const b64url = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const randStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
  const redirectUri = () => location.origin + location.pathname;
  const dbxToken = async params => {
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams(Object.assign({ client_id: DBX_KEY }, params)) });
    if (!r.ok) { const err = new Error('token ' + r.status); err.auth = r.status === 400 || r.status === 401; throw err; }
    return r.json();
  };
  const dbxConnect = async () => {
    const verifier = randStr(48), state = randStr(16);
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    try { localStorage.setItem(DKEY + '.pkce', JSON.stringify({ verifier, state, back: location.hash || '#review' })); } catch (e) {}
    location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({ client_id: DBX_KEY, response_type: 'code', code_challenge: challenge, code_challenge_method: 'S256', redirect_uri: redirectUri(), token_access_type: 'offline', state });
  };
  const dbxFinishAuth = async () => {
    const p = new URLSearchParams(location.search); if (!p.has('code') && !p.has('error')) return;
    let pk = null; try { pk = JSON.parse(localStorage.getItem(DKEY + '.pkce') || 'null'); localStorage.removeItem(DKEY + '.pkce'); } catch (e) {}
    history.replaceState(null, '', redirectUri() + ((pk && pk.back) || '#review'));
    if (p.has('error')) { dbx.msg = 'Dropbox sign-in was cancelled.'; return; }
    if (!pk || pk.state !== p.get('state')) { dbx.msg = 'Dropbox sign-in finished in a different window. Tap “Connect Dropbox” again from here.'; return; }
    try {
      const t = await dbxToken({ code: p.get('code'), grant_type: 'authorization_code', code_verifier: pk.verifier, redirect_uri: redirectUri() });
      dbx.tok = { refresh: t.refresh_token, access: t.access_token, exp: Date.now() + (t.expires_in - 60) * 1000 }; dbxSaveTok();
      dbx.msg = 'Dropbox connected. Progress now syncs automatically.';
    } catch (e) { dbx.msg = 'Dropbox sign-in didn’t complete. Check the app key and redirect URI, then try again.'; }
  };
  const dbxAccess = async force => {
    if (!dbx.tok) throw Object.assign(new Error('no token'), { auth: true });
    if (!force && dbx.tok.access && Date.now() < dbx.tok.exp) return dbx.tok.access;
    const t = await dbxToken({ grant_type: 'refresh_token', refresh_token: dbx.tok.refresh });
    dbx.tok.access = t.access_token; dbx.tok.exp = Date.now() + (t.expires_in - 60) * 1000; dbxSaveTok();
    return dbx.tok.access;
  };
  const dbxCall = async (url, headers, body) => {
    for (let i = 0; i < 2; i++) {
      const r = await fetch(url, { method: 'POST', headers: Object.assign({ Authorization: 'Bearer ' + await dbxAccess(i > 0) }, headers), body });
      if (r.status !== 401) return r;
    }
    throw Object.assign(new Error('unauthorised'), { auth: true });
  };
  const dbxPull = async () => {
    const r = await dbxCall('https://content.dropboxapi.com/2/files/download', { 'Dropbox-API-Arg': JSON.stringify({ path: DPATH }) });
    if (r.status === 409) return null; // no file yet
    if (!r.ok) throw new Error('download ' + r.status);
    try { return JSON.parse(await r.text()); } catch (e) { return null; }
  };
  const dbxPush = async body => {
    const r = await dbxCall('https://content.dropboxapi.com/2/files/upload', { 'Dropbox-API-Arg': JSON.stringify({ path: DPATH, mode: 'overwrite', mute: true }), 'Content-Type': 'application/octet-stream' }, JSON.stringify(body));
    if (!r.ok) throw new Error('upload ' + r.status);
  };
  const dbxSync = async () => {
    if (!DBX_ON || !dbx.tok) return;
    if (dbx.busy) { dbx.again = true; return; }
    dbx.busy = true; setSync('saving');
    try {
      const remote = await dbxPull();
      const merged = remote ? merge(S, remote) : S;
      if (canon(merged) !== canon(S)) { S = merged; saveLocal(); refreshAfterSync(); }
      if (!remote || canon(norm(remote)) !== canon(S)) await dbxPush(Object.assign({ app: 'me-prep', version: 1 }, JSON.parse(canon(S))));
      setSync('synced');
    } catch (e) {
      if (e.auth) { dbx.tok = null; dbxSaveTok(); setSync('reauth'); }
      else setSync(navigator.onLine === false || e instanceof TypeError ? 'offline' : 'error');
    }
    dbx.busy = false;
    if (dbx.again) { dbx.again = false; dbxSync(); }
  };
  function dbxSchedule() { if (!DBX_ON || !dbx.tok) return; clearTimeout(dbx.timer); dbx.timer = setTimeout(dbxSync, 2000); }
  const dbxDisconnect = async () => {
    const tok = dbx.tok; dbx.tok = null; dbxSaveTok(); setSync('local'); dbx.msg = 'Dropbox disconnected on this device. Your progress file stays in Dropbox.';

  const initDropbox = async () => {

  const initCloud = async () => {

      const merged = remote ? merge(S, remote) : S;
      if (canon(merged) !== canon(S)) { S = merged; saveLocal(); refreshAfterSync(); }

    }, () => { sync.ref = null; setSync('error'); });
  };
  const syncNote = () => DBX_ON ? ({
    local: 'Progress is saved in this browser only. Connect Dropbox to sync it with your other devices.',

  /* ---------- block renderer ---------- */
  const renderBlock = b => {

  const V = {};
  V.home = () => {
    setTop(); setTab('home');
    const done = LESSONS.filter(l => S.done[l.key]).length, reviewed = Object.keys(S.q).length, again = againList().length;
    const remainingMin = LESSONS.filter(l => !S.done[l.key] && trackOk(l.mod)).reduce((s, l) => s + l.min, 0);
    const nx = nextLesson();
    const intPlan = [['interview-1', 'Script and rehearse your opener'], ['interview-2', 'Build and rehearse your STAR stories'],
      ['actdesign-1', 'Actuator requirements and architectures'], ['actdesign-2', 'Motor sizing and windings'], ['actdesign-3', 'Gear sizing, life and stiffness'],
      ['actdesign-5', 'Brakes, safety and slip detection'], ['actdesign-6', 'Thermal design and duty cycles'], ['actdesign-9', 'Talk through a full joint sizing'],
      ['power-2', 'Harmonic vs cycloidal vs planetary'], ['shafts-2', 'Bearings and preload'], ['pid-2', 'Cascaded servo loops and compliance'], ['interview-3', 'Whiteboard problems']];
    view.innerHTML = `
      <section class="tb">
        <div class="tb-main"><span class="doctype">Study set · Rev A</span><h1>Mechanical, robotics &amp; controls fundamentals</h1>
        <p class="sub">Short lessons with diagrams and reveal-the-answer questions, for senior ME interviews and the FE Mechanical exam.</p></div>
        <div class="tb-grid">
          <div class="cell"><span class="k">Lessons done</span><span class="v">${done}<small> / ${LESSONS.length}</small></span></div>
          <div class="cell"><span class="k">Questions tried</span><span class="v">${reviewed}</span></div>
          <div class="cell"><span class="k">Review queue</span><span class="v">${again}</span></div>
          <div class="cell"><span class="k">Time left</span><span class="v">${(remainingMin / 60).toFixed(1)}<small> h</small></span></div>
        </div>
      </section>
      ${trackSeg()}
      ${nx ? `<a class="next" href="#l-${nx.key}"><span style="min-width:0"><span class="k">${S.last === nx.key ? 'Continue' : 'Up next'}</span><div class="t">${nx.title}</div><div class="m">${nx.mod.num} ${nx.mod.title} · ${nx.min} min · ${qCount(nx)} questions</div></span><span class="go">Start</span></a>` : ''}
      ${again ? `<a class="next" href="#review" style="border-color:var(--rust);background:var(--rust-soft)"><span><span class="k" style="color:var(--rust)">Review queue</span><div class="t">${again} question${again > 1 ? 's' : ''} marked “review again”</div></span><span class="go" style="background:var(--rust)">Drill</span></a>` : ''}
      ${S.track !== 'fe' ? `<div class="eyebrow">Actuator interview sprint · ${intPlan.length} lessons to do first</div><ol class="plan">${intPlan.filter(([k]) => BYKEY[k]).map(([k, why]) => `<li><div><a href="#l-${k}">${BYKEY[k].title}</a><span>${why} · ${BYKEY[k].min} min${S.done[k] ? ' · done' : ''}</span></div></li>`).join('')}</ol>` : ''}
      ${S.track !== 'int' ? `<div class="eyebrow">FE Mechanical · how this set maps to the exam</div>
      <p class="small" style="margin:0 0 8px">The FE is 110 questions in 6 hours, closed book except the NCEES FE Reference Handbook (searchable PDF on screen). Practise finding each formula in the Handbook, not memorising it. Heaviest areas: mechanics of materials, dynamics & vibrations, thermodynamics, fluids, heat transfer, and mechanical design.</p>` : ''}
      <div class="eyebrow">All topics</div>

  };

  V.topics = () => {
    setTop(); setTab('topics');
    view.innerHTML = `${trackSeg()}${GROUPS.map(([g, t]) => { const ms = MODS.filter(m => m.group === g && trackOk(m)); return ms.length ? `<h2>${t}</h2><div class="group">${ms.map(modRow).join('')}</div>` : ''; }).join('')}`;
  };

  V.module = id => {
    const m = BYMOD[id]; if (!m) return V.home();
    setTop(`${m.num} · ${m.title}`, '#topics'); setTab('topics');
    view.innerHTML = `<section class="tb"><div class="tb-main"><span class="doctype">Module ${m.num}</span><h1>${m.title}</h1><p class="sub">${m.blurb}</p></div>
      <div class="tb-grid"><div class="cell"><span class="k">Lessons</span><span class="v">${modDone(m)}<small> / ${m.lessons.length}</small></span></div>
      <div class="cell"><span class="k">Time</span><span class="v">${m.lessons.reduce((s, l) => s + l.min, 0)}<small> min</small></span></div>
      <div class="cell"><span class="k">Questions</span><span class="v">${m.lessons.reduce((s, l) => s + qCount(l), 0)}</span></div>
      <div class="cell"><span class="k">Scope</span><span class="v" style="font-size:13px">${m.tracks.map(t => t === 'fe' ? 'FE' : 'Interview').join(' + ')}</span></div></div></section>
      ${m.lessons.map(l => `<a class="lrow" href="#l-${l.key}"><span class="check ${S.done[l.key] ? 'on' : ''}" aria-label="${S.done[l.key] ? 'Done' : 'Not done'}"></span><span style="min-width:0"><span class="lt">${l.title}</span><span class="lm" style="display:block">L${l.idx + 1} · ${l.min} min · ${qCount(l)} questions</span></span><span class="prog">→</span></a>`).join('')}
      <div class="row" style="margin-top:16px"><button class="btn" data-drill="${m.id}">Drill this module's questions</button></div>`;
  };

  const qHtml = (l, i, q) => {
    const id = l.key + ':' + i, st = S.q[id], kind = q[2] || '';
    return `<article class="q" data-q="${id}"><div class="q-h"><span class="q-n">Q${i + 1}</span><span class="q-t">${q[0]}</span><span class="q-kind ${kind}">${kindLabel[kind]}</span></div>

  };

  V.lesson = key => {
    const l = BYKEY[key]; if (!l) return V.home();
    const m = l.mod; if (S.last !== key) { S.last = key; stamp('last'); save(); }
    setTop(`${m.num}.${l.idx + 1} · ${m.title}`, '#m-' + m.id); setTab('topics');

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const startDeck = (kind, arg) => {

  V.review = () => {
    setTop(); setTab('review');

    view.innerHTML = `<section class="tb"><div class="tb-main"><span class="doctype">Drill</span><h1>Flashcard review</h1><p class="sub">Up to 40 shuffled cards per session. Mark each card “Got it” or “Review again”; the review queue keeps the ones you missed until you get them.</p></div></section>
      <div class="picker">
        <button class="btn ${again ? 'acc' : ''}" data-deck="again" ${again ? '' : 'disabled'}>Review queue (${again})</button>
        <button class="btn" data-deck="done" ${doneQ ? '' : 'disabled'}>From completed lessons (${doneQ})</button>
        <button class="btn" data-deck="int">Interview questions only</button>

        <button class="btn" data-deck="mix">Mixed · current focus</button>
        <label class="small" for="mod-pick">Or drill one module</label>
        <select id="mod-pick"><option value="">Choose a module…</option>${MODS.map(m => `<option value="${m.id}">${m.num} · ${m.title}</option>`).join('')}</select>
      </div>
      <div class="eyebrow">Your progress on other devices</div>
      <p class="small" id="sync-note" style="margin:0 0 10px">${syncNote()}</p>
      ${DBX_ON ? `<div class="row" style="margin-bottom:10px">${dbx.tok
        ? '<button class="btn acc" data-dbx="sync">Sync now</button><button class="btn" data-dbx="disconnect">Disconnect Dropbox</button>'
        : '<button class="btn acc" data-dbx="connect">Connect Dropbox</button>'}</div>${dbx.msg ? `<p class="small" style="margin:0 0 14px">${esc(dbx.msg)}</p>` : ''}` : ''}
      <div class="row">
        <button class="btn" data-export>Save progress file</button>
        <label class="btn" for="imp-file" style="text-align:center;flex:1 1 140px">Load progress file</label>
        <input id="imp-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p class="small" id="file-msg" style="margin:8px 0 0">Save the file into your cloud folder, then load it on your other device. Loading merges it with what is here; the newer change to each item wins.</p>`;
  };

  /* progress files: works in every copy of the app, online or offline */
  const fileMsg = m => { const el = document.getElementById('file-msg'); if (el) el.textContent = m; };
  const exportProgress = async () => {

    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    fileMsg('Downloaded ' + filename + '. Move it into your cloud folder to load it on your other device.');
  };
  const importProgress = file => {
    const r = new FileReader();
    r.onload = () => {
      let o = null; try { o = JSON.parse(r.result); } catch (e) {}
      if (!o || o.app !== 'me-prep' || typeof o.done !== 'object' || typeof o.q !== 'object') { fileMsg('That file isn’t a progress file from this app. Choose me-prep-progress.json.'); return; }
      const before = canon(S); S = merge(S, o);

  document.addEventListener('change', e => { if (e.target.id === 'imp-file' && e.target.files[0]) { importProgress(e.target.files[0]); e.target.value = ''; } });

  const refreshAfterSync = () => {

    if (h === 'home' || h === 'topics' || h === 'review' || h.startsWith('m-')) { const y = window.scrollY; route(); window.scrollTo(0, y); }
  };

  V.drill = () => {
    setTop(deckName, '#review'); setTab('review');
    if (!deck.length) { view.innerHTML = `<div class="empty">No cards in this deck. Pick a different deck from Review.</div>`; return; }
    if (di >= deck.length) {
      const got = deck.filter(x => S.q[x.id] === 'got').length;
      view.innerHTML = `<section class="tb"><div class="tb-main"><span class="doctype">Session complete</span><h1>${got} of ${deck.length} marked “Got it”</h1><p class="sub">Anything marked “Review again” is waiting in the review queue.</p></div></section><div class="row"><button class="btn primary" data-restart>Go again</button><button class="btn" data-href="#review">Choose another deck</button></div>`; return;
    }
    const c = deck[di], st = S.q[c.id];
    view.innerHTML = `<div class="card" data-q="${c.id}"><div class="card-top"><span>${c.l.mod.num} · ${c.l.title}</span><span>${di + 1}/${deck.length}</span></div>
      <div class="card-q">${c.q[0]}</div><div class="card-a q-a" hidden>${c.q[1]}</div>
      <div class="q-actions"><button class="btn primary wide reveal">Reveal answer</button>
      <button class="btn good" data-mark="got" data-adv="1" aria-pressed="${st === 'got'}" hidden>Got it</button><button class="btn again" data-mark="again" data-adv="1" aria-pressed="${st === 'again'}" hidden>Review again</button></div></div>
      <p class="small" style="margin-top:12px"><a href="#l-${c.l.key}">Open the lesson for this card →</a></p>`;
  };

  V.formulas = () => {
    setTop(); setTab('formulas');
    const mods = MODS.filter(trackOk).map(m => { const rows = m.lessons.flatMap(l => l.b.filter(b => b[0] === 'f').map(b => ({ l, rows: b[1] }))); return { m, rows }; }).filter(x => x.rows.length);
    view.innerHTML = `<section class="tb"><div class="tb-main"><span class="doctype">Reference</span><h1>Formula sheet</h1><p class="sub">Every equation in the set, grouped by module. For the FE, also locate each one in the NCEES Reference Handbook so you can find it fast on exam day.</p></div></section>
      ${trackSeg()}<div style="margin-top:14px">${mods.map(({ m, rows }) => `<details class="fs"><summary><span>${m.num} · ${m.title}</span></summary>${rows.map(r => `<div class="fs-l"><a href="#l-${r.l.key}">${r.l.title}</a></div><div class="formulas">${r.rows.map(([e, nn]) => `<div class="fr"><div class="e">${e}</div>${nn ? `<div class="n">${nn}</div>` : ''}</div>`).join('')}</div>`).join('')}</details>`).join('')}</div>`;
  };

  let lastQuery = '';
  const index = LESSONS.map(l => ({ l, text: strip(l.title + ' ' + l.b.map(b => b[0] === 'fig' ? (b[2] || '') : JSON.stringify(b[1])).join(' ')).toLowerCase(), qs: (l.q || []).map(q => strip(q[0] + ' ' + q[1]).toLowerCase()) }));
  V.search = () => {
    setTop(); setTab('search');
    view.innerHTML = `<label class="small" for="q-in">Search lessons, formulas and questions</label><input id="q-in" type="search" placeholder="e.g. Goodman, harmonic drive, PPAP, Kalman" value="${esc(lastQuery)}" autocomplete="off"><div id="hits" style="margin-top:8px"></div>`;
    const inp = $('#q-in'); inp.addEventListener('input', () => { lastQuery = inp.value; runSearch(); }); runSearch(); inp.focus();
  };
  const runSearch = () => {
    const q = lastQuery.trim().toLowerCase(), out = $('#hits'); if (!out) return;
    if (q.length < 2) { out.innerHTML = `<p class="small">Try: <a href="#" data-q-sug="fatigue">fatigue</a> · <a href="#" data-q-sug="bearing">bearing</a> · <a href="#" data-q-sug="cpk">Cpk</a> · <a href="#" data-q-sug="jacobian">Jacobian</a> · <a href="#" data-q-sug="anodiz">anodizing</a> · <a href="#" data-q-sug="overfit">overfitting</a></p>`; return; }
    const terms = q.split(/\s+/);
    const hits = index.map(x => { const inTitle = terms.every(t => x.l.title.toLowerCase().includes(t)); const inText = terms.every(t => x.text.includes(t)); const qn = x.qs.filter(s => terms.every(t => s.includes(t))).length; return { x, score: (inTitle ? 10 : 0) + (inText ? 3 : 0) + qn }; }).filter(h => h.score > 0).sort((a, b) => b.score - a.score).slice(0, 30);
    const snip = t => { const i = t.indexOf(terms[0]); if (i < 0) return ''; const s = t.slice(Math.max(0, i - 50), i + 90); return '…' + esc(s).replace(new RegExp(terms[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), m => `<mark>${m}</mark>`) + '…'; };
    out.innerHTML = hits.length ? hits.map(({ x }) => `<a class="hit" href="#l-${x.l.key}"><div class="t">${x.l.title}</div><div class="s">${x.l.mod.num} ${x.l.mod.title} · ${snip(x.text)}</div></a>`).join('') : `<div class="empty">Nothing matches “${esc(lastQuery)}”. Try a shorter word or a synonym.</div>`;
  };

  /* ---------- router ---------- */
  const route = () => {
    const h = location.hash.slice(1) || 'home';
    if (h.startsWith('m-')) V.module(h.slice(2));
    else if (h.startsWith('l-')) V.lesson(h.slice(2));
    else if (V[h]) V[h]();
    else V.home();
    badge();
    if (!h.startsWith('l-')) window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', route);

  document.addEventListener('click', e => {
    const t = e.target.closest('button, a'); if (!t) return;
    if (t.dataset.go) { location.hash = t.dataset.go; return; }
    if (t.dataset.href) { location.hash = t.dataset.href.slice(1); return; }
    if (t.dataset.track) { S.track = t.dataset.track; stamp('track'); save(); route(); return; }
    if (t.dataset.qSug !== undefined) { e.preventDefault(); lastQuery = t.dataset.qSug; $('#q-in').value = lastQuery; runSearch(); return; }
    if (t.dataset.deck) { startDeck(t.dataset.deck); return; }
    if (t.dataset.drill) { startDeck('mod', t.dataset.drill); return; }
    if (t.hasAttribute('data-export')) { exportProgress(); return; }
    if (t.dataset.dbx === 'connect') { dbxConnect(); return; }
    if (t.dataset.dbx === 'sync') { dbx.msg = ''; dbxSync().then(() => { if (location.hash === '#review') V.review(); }); return; }
    if (t.dataset.dbx === 'disconnect') { dbxDisconnect().then(() => V.review()); V.review(); return; }
    if (t.hasAttribute('data-restart')) { shuffle(deck); di = 0; V.drill(); return; }
    if (t.classList.contains('reveal')) {
      const box = t.closest('[data-q]'); box.querySelector('.q-a').hidden = false; t.hidden = true;
      box.querySelectorAll('[data-mark]').forEach(b => b.hidden = false); return;
    }
    if (t.dataset.mark) {
      const box = t.closest('[data-q]'), id = box.dataset.q; S.q[id] = t.dataset.mark; stamp('q:' + id); save();
      box.querySelectorAll('[data-mark]').forEach(b => b.setAttribute('aria-pressed', b === t)); badge();
      if (t.dataset.adv) { di++; V.drill(); window.scrollTo(0, 0); }
      return;
    }
    if (t.dataset.done) {
      const k = t.dataset.done; if (S.done[k]) delete S.done[k]; else S.done[k] = Date.now(); stamp('d:' + k);
      t.classList.toggle('acc', !S.done[k]); t.textContent = S.done[k] ? '✓ Completed · tap to undo' : 'Mark lesson complete';
      if (S.done[k]) { const i = LESSONS.indexOf(BYKEY[k]); const nx = LESSONS[i + 1]; if (nx) { S.last = nx.key; stamp('last'); } }
      save();
      return;
    }
  });
  document.addEventListener('change', e => { if (e.target.id === 'mod-pick' && e.target.value) startDeck('mod', e.target.value); });

  route();
  initCloud();
  initDropbox();
})();

</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>

</html>
